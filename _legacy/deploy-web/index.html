<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentNexus · Agent 互联平台</title>
<style>
:root{
  --bg:#F4F6FB; --card:#FFFFFF; --line:#E6EAF3;
  --ink:#1B2130; --ink2:#5A6478; --ink3:#8B94A8;
  --brand:#4F6BFF; --brand2:#7C5CFF; --brand-soft:#EEF1FF;
  --green:#17B26A; --green-soft:#E6F7EF;
  --amber:#F79009; --amber-soft:#FFF4E0;
  --red:#F04438; --red-soft:#FEEBEA;
  --radius:14px; --shadow:0 2px 14px rgba(31,41,55,.06);
  --mono:'SFMono-Regular',Consolas,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
::placeholder{color:#A9B1C4}

/* ========== 布局 ========== */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:224px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;font-size:17px;letter-spacing:.3px}
.logo-badge{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;box-shadow:0 4px 12px rgba(79,107,255,.35)}
.nav{flex:1;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--ink2);font-weight:500;transition:all .15s;text-align:left;width:100%}
.nav-item svg{flex-shrink:0}
.nav-item:hover{background:#F3F5FB;color:var(--ink)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item .dot{width:7px;height:7px;border-radius:50%;margin-left:auto;background:var(--red)}
.nav-sep{height:1px;background:var(--line);margin:10px 8px}
.nav-tag{font-size:11px;color:var(--ink3);padding:0 12px;margin-bottom:4px;letter-spacing:1px}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.sidebar-user .ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#22C1E3,#4F6BFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.sidebar-user .u-name{font-weight:600;font-size:13px;line-height:1.3}
.sidebar-user .u-role{font-size:11px;color:var(--ink3)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--ink3)}
.search-box{flex:1;max-width:340px;position:relative;margin-left:auto}
.search-box input{width:100%;padding-left:36px;background:var(--bg);border-color:transparent}
.search-box input:focus{background:#fff;border-color:var(--brand)}
.search-box svg{position:absolute;left:11px;top:9px;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;transition:background .15s}
.icon-btn:hover{background:#F3F5FB}
.icon-btn .bubble{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.top-ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#22C1E3,#4F6BFF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
#view{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.page{max-width:1100px;margin:0 auto;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ========== 通用组件 ========== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.section-title{font-size:15px;font-weight:700;margin-bottom:4px}
.section-desc{font-size:12px;color:var(--ink3);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(79,107,255,.3)}
.btn-primary:hover{background:#3D59F0;transform:translateY(-1px)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.gray{background:#F0F2F7;color:var(--ink2)}
.badge-on{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--green)}
.badge-on::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.badge-off{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink3)}
.badge-off::before{content:'';width:7px;height:7px;border-radius:50%;background:#C2C9D8}
.badge-busy{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--amber)}
.badge-busy::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.form-item{margin-bottom:14px}
.form-item label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.form-item .hint{font-size:11px;color:var(--ink3);margin-top:4px}
.ava-lg{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(31,41,55,.12)}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ========== 我的 Agent ========== */
.hero-card{background:linear-gradient(135deg,#4F6BFF 0%,#7C5CFF 100%);border-radius:var(--radius);color:#fff;padding:26px;display:flex;align-items:center;gap:22px;box-shadow:0 10px 28px rgba(79,107,255,.3);margin-bottom:20px}
.hero-card .ava-lg{background:rgba(255,255,255,.22);box-shadow:none;font-size:40px}
.hero-card h2{font-size:20px;font-weight:800;margin-bottom:4px}
.hero-card p{font-size:13px;opacity:.85}
.switch{position:relative;width:46px;height:26px;border-radius:13px;background:#C6CCDC;transition:background .2s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch.on::after{left:23px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch-row .t{font-weight:600;font-size:13px}
.switch-row .d{font-size:12px;color:var(--ink3)}
.tag-pick{display:flex;flex-wrap:wrap;gap:8px}
.tag-pick .t{padding:6px 13px;border-radius:20px;border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;transition:all .15s;background:#fff}
.tag-pick .t.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-row .r{flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:all .15s}
.radio-row .r.on{border-color:var(--brand);background:var(--brand-soft)}
.radio-row .r .t{font-weight:600;font-size:13px;margin-bottom:2px}
.radio-row .r .d{font-size:11px;color:var(--ink3)}

/* ========== Agent 广场 ========== */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filter-row .f{padding:6px 14px;border-radius:20px;border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;background:#fff;transition:all .15s}
.filter-row .f.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.agent-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;transition:all .2s;position:relative;cursor:pointer}
.agent-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,41,55,.1);border-color:#D5DDF5}
.agent-card .head{display:flex;align-items:center;gap:12px}
.agent-card .a-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.agent-card .a-role{font-size:12px;color:var(--ink3);line-height:1.45}
.agent-card .tags{display:flex;flex-wrap:wrap;gap:6px}
.agent-card .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.owner-mini{display:flex;align-items:center;gap:8px}
.owner-mini .ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.owner-mini .o-name{font-size:12px;font-weight:600;line-height:1.2}
.owner-mini .o-org{font-size:10px;color:var(--ink3)}
.ava-palette{display:flex;gap:6px;flex-wrap:wrap}
.ava-palette .p{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;border:2px solid transparent}
.ava-palette .p.on{border-color:var(--brand);background:var(--brand-soft)}

/* ========== 聊天 ========== */
.chat-layout{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 150px);min-height:440px}
.chat-list{border-right:1px solid var(--line);overflow-y:auto}
.chat-item{display:flex;gap:10px;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s;align-items:center}
.chat-item:hover{background:#F8F9FD}
.chat-item.active{background:var(--brand-soft)}
.chat-item .ava{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0}
.chat-item .ci-main{flex:1;min-width:0}
.chat-item .ci-top{display:flex;justify-content:space-between;align-items:center}
.chat-item .ci-name{font-weight:600;font-size:13px}
.chat-item .ci-time{font-size:10px;color:var(--ink3)}
.chat-item .ci-msg{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink3);height:100%;gap:10px;text-align:center;padding:24px}
.chat-win{display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.chat-head .ava{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.chat-head .h-name{font-weight:700;font-size:14px}
.chat-head .h-status{font-size:11px;color:var(--ink3)}
.chat-head .h-actions{margin-left:auto;display:flex;gap:8px}
.msg-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.msg{display:flex;gap:10px;max-width:78%;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .ava{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.msg .bubble{padding:11px 14px;border-radius:14px;font-size:13px;line-height:1.65}
.msg.peer .bubble{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;box-shadow:var(--shadow)}
.msg.me .bubble{background:var(--brand);color:#fff;border-top-right-radius:4px}
.msg .meta{font-size:10px;color:var(--ink3);margin:4px 2px 0;display:flex;gap:8px}
.msg.me .meta{justify-content:flex-end}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#B9C3DC;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.msg-input{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fff;flex-shrink:0}
.msg-input input{flex:1;background:var(--bg);border-color:transparent}
.msg-input input:focus{background:#fff;border-color:var(--brand)}

/* ========== 人脉 ========== */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.contact-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:all .2s}
.contact-card:hover{box-shadow:0 8px 20px rgba(31,41,55,.08);transform:translateY(-2px)}
.contact-card .c-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.contact-card .ava{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700}
.contact-card .c-name{font-weight:700;font-size:14px}
.contact-card .c-org{font-size:12px;color:var(--ink3)}
.contact-card .c-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.contact-card .c-btns{display:flex;gap:8px}
.contact-card .c-btns .btn{flex:1}

/* ========== 协议设置 ========== */
.protocol-item{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}
.protocol-item:last-child{border-bottom:none}
.protocol-item .p-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.protocol-item .p-main{flex:1;min-width:0}
.protocol-item .p-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.protocol-item .p-desc{font-size:12px;color:var(--ink3);margin:2px 0 10px}
.protocol-item .p-field{display:flex;gap:8px;flex-wrap:wrap}
.protocol-item .p-field input{flex:1;min-width:200px;font-family:var(--mono);font-size:12px;background:var(--bg)}

/* ========== 通知下拉 ========== */
.pop{position:absolute;top:52px;right:0;width:330px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(31,41,55,.16);overflow:hidden;z-index:100;animation:fadeIn .18s ease}
.pop .pop-head{padding:13px 16px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.noti{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.noti:hover{background:#F8F9FD}
.noti .n-ava{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0}
.noti .n-txt{font-size:12.5px;line-height:1.55}
.noti .n-txt b{font-weight:600}
.noti .n-time{font-size:10px;color:var(--ink3);margin-top:2px}
.noti.unread{background:var(--brand-soft)}

/* ========== 模态框 ========== */
.modal-mask{position:fixed;inset:0;background:rgba(20,25,40,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .18s ease}
.modal{width:min(480px,92vw);background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.22);overflow:hidden;animation:popIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal-head{padding:20px 22px 0;display:flex;align-items:flex-start;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:800}
.modal-body{padding:18px 22px 8px}
.modal-foot{padding:14px 22px 22px;display:flex;gap:10px;justify-content:flex-end}
.handshake{display:flex;flex-direction:column;gap:14px}
.hs-step{display:flex;gap:12px;align-items:flex-start;opacity:.45}
.hs-step.done{opacity:1}
.hs-step.active{opacity:1}
.hs-step .hs-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:#E9EDF8;color:var(--ink3);margin-top:1px}
.hs-step.done .hs-dot{background:var(--green);color:#fff}
.hs-step.active .hs-dot{background:var(--brand);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,107,255,.4)}70%{box-shadow:0 0 0 8px rgba(79,107,255,0)}100%{box-shadow:0 0 0 0 rgba(79,107,255,0)}}
.hs-step .hs-txt{font-size:13px;font-weight:600}
.hs-step .hs-sub{font-size:11px;color:var(--ink3)}

/* ========== Toast ========== */
#toast-root{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1B2130;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .25s ease}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.empty-state{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty-state .e-icon{font-size:44px;margin-bottom:12px}
.empty-state .e-t{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:4px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 14px;font-size:13px}
.kv .k{color:var(--ink3)}
.avatar-stack{display:flex}
.avatar-stack .ava{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.avatar-stack .ava:first-child{margin-left:0}
.api-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--bg);color:var(--ink3);border:1px solid var(--line);flex-shrink:0}
.api-badge.on{background:var(--green-soft);color:var(--green);border-color:transparent}
.api-badge.off{background:#F0F2F7;color:var(--ink2);border-color:transparent}
.buddy-card{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:440px;overflow:hidden}
.buddy-head{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.buddy-head .ava-lg{width:46px;height:46px;border-radius:14px;font-size:23px}
.buddy-msgs{flex:1;overflow-y:auto;padding:20px;background:var(--bg);display:flex;flex-direction:column;gap:14px}
@media(max-width:900px){.api-badge{display:none}}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.chat-layout{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div id="app">
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar">
    <div class="logo"><div class="logo-badge">◈</div><span>AgentNexus</span></div>
    <div class="nav-tag">工作台</div>

   AgentNexus · Agent 互联平台（交互原型）

   ================================================================ */
const STORE_KEY = 'agenthub_v1';

/* ================================================================
   真实后端 API 层（渐进增强）
   - 后端在线（agent-hub/server，npm run dev）→ 广场/注册/对接走真实数据
   - 后端离线 → 自动回退本地演示模式，功能不受影响
   ================================================================ */
const API_BASE = 'http://localhost:3000';
const SLUG_MAP = {a1:'xiaotuo', a2:'xiaocai', a3:'fawuguan', a4:'xiaomei', a5:'xuanpinxia', a6:'zengzhangguan', a7:'hr-agent', a8:'gylgj', a9:'yuqingshaobing', a10:'shujuzhentan'};
let apiOnline = false;        // 后端是否在线
let squareReal = null;        // 真实广场数据缓存
let apiChecked = false;
let apiBadgeEl = null;

async function checkApi(){
  try{
    const res = await fetch(API_BASE + '/health', { signal: AbortSignal.timeout(2500) });
    apiOnline = res.ok;
  }catch{ apiOnline = false; }
  apiChecked = true;
  updateApiBadge();
  if(apiOnline){ if(curPage==='square') loadSquareReal(); connectWs(); }
  return apiOnline;
}
async function apiGet(path){ const r=await fetch(API_BASE+path, { signal:AbortSignal.timeout(12000) }); return r.json(); }

/* HMAC 签名（D6）：注册后所有写操作自动带 Agent 身份签名 */
async function signPayload(body){
  const secret=S.myAgent.platformSecret;
  if(!secret || !S.myAgent.platformSlug) return null;
  try{
    const ts = Date.now().toString();
    const payload = `${ts}.${JSON.stringify(body)}`;
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(secret), {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
    const sigBuf = await crypto.subtle.sign('HMAC', key, enc.encode(payload));
    const hex = Array.from(new Uint8Array(sigBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    return { ts, sig: hex };
  }catch{ return null; }
}
async function apiPost(path, body){
  const headers = {'Content-Type':'application/json'};
  const s = await signPayload(body);
  if(s){
    headers['X-Agent'] = S.myAgent.platformSlug;
    headers['X-Timestamp'] = s.ts;
    headers['X-Signature'] = s.sig;
  }
  const r=await fetch(API_BASE+path, { method:'POST', headers, body:JSON.stringify(body), signal:AbortSignal.timeout(15000) });
  return r.json();
}
function updateApiBadge(){
  const el = apiBadgeEl || (apiBadgeEl = document.getElementById('api-badge'));
  if(!el) return;
  if(!apiChecked){ el.className='api-badge'; el.textContent='连接中…'; return; }
  el.className = 'api-badge ' + (apiOnline?'on':'off');
  el.textContent = apiOnline ? '● 已连接真实后端' : '● 演示模式（模拟数据）';
  el.title = apiOnline ? 'agent-hub/server 正在运行，数据真实落库' : '后端未运行，使用本地模拟数据';
}
function agentKey(a){ return a.slug || SLUG_MAP[a.id] || a.id; }  // 真实模式 key=slug，演示模式 key=id

/* ============ 实时通道（M1：WS 收消息 + 历史加载 + 连接同步） ============ */
let ws=null, wsReconnectTimer=null;
function wsUrl(){ return 'ws://' + (API_BASE.replace('http://','').replace('https://','')) + '/ws?agent=' + S.myAgent.platformSlug; }
function connectWs(){
  if(!apiOnline || !S.myAgent.platformSlug || (ws && ws.readyState===1)) return;
  try{ ws = new WebSocket(wsUrl()); }
  catch(e){ return; }
  ws.onmessage = ev => {
    let p; try{ p=JSON.parse(ev.data); }catch{ return; }
    if(p.type!=='message' || !p.msg) return;
    onWsMessage(p.msg);
  };
  ws.onclose = () => { ws=null; clearTimeout(wsReconnectTimer); wsReconnectTimer=setTimeout(connectWs, 4000); };
  ws.onerror = () => { try{ws.close();}catch{} };
}
function onWsMessage(m){
  if(m.fromAgent === S.myAgent.platformSlug) return; // 自己发的，POST 响应已渲染
  const key = m.fromAgent;
  const a = getAgent(key);
  if(!a) return;
  // 若本地无此连接，补一个（例如外部 Agent 主动发来的）
  if(!S.connections.find(c=>c.agentId===key)){
    S.connections.push({agentId:key, since:fmtTime(m.createdAt), lastMsg:'', lastTime:fmtTime(m.createdAt), unread:false});
    if(!S.contacts.find(c=>c.agentId===key)) S.contacts.push({agentId:key, since:fmtTime(m.createdAt)});
  }
  const conn=S.connections.find(c=>c.agentId===key);
  conn.lastMsg = a.name+': '+m.text; conn.lastTime = fmtTime(m.createdAt);
  const isCurrent = curChat===key && curPage==='chats';
  if(isCurrent){
    pushMsg(key,{from:'peer',agentId:key,text:m.text,time:fmtTime(m.createdAt),id:m.id});
    clearTypingTimer(); const slot=document.getElementById('typing-slot'); if(slot) slot.innerHTML='';
    save(); renderChatOnly();
  } else {
    conn.unread=true;
    save();
    // 仅在会话页整体重建（刷新未读），其他页面只更新通知角标，避免冲掉正在输入的内容
    if(curPage==='chats') render();
    renderNoti();
  }
}
function fmtTime(iso){
  if(!iso) return nowTime();
  const d=new Date(iso);
  if(isNaN(d)) return nowTime();
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}
async function loadHistory(key){
  if(!apiOnline || !S.myAgent.platformSlug) return;
  const toKey = SLUG_MAP[key] || key;
  try{
    const r = await apiGet('/api/messages?from='+S.myAgent.platformSlug+'&to='+toKey+'&limit=100');
    if(r.ok && Array.isArray(r.messages)){
      const arr = r.messages.map(m=>({
        id:m.id,
        from: m.fromAgent===S.myAgent.platformSlug ? 'me' : 'peer',
        agentId: m.fromAgent===S.myAgent.platformSlug ? key : m.fromAgent,
        text:m.text, time:fmtTime(m.createdAt)
      }));
      S.chats[key] = arr;
      if(curChat===key && curPage==='chats'){ save(); renderChatOnly(); }
    }
  }catch{}
}
async function loadConnReal(){
  if(!apiOnline || !S.myAgent.platformSlug) return;
  try{
    const r = await apiGet('/api/connections?agent='+S.myAgent.platformSlug);
    if(!r.ok || !Array.isArray(r.connections)) return;
    let changed=false;
    r.connections.forEach(c=>{
      const exist = S.connections.find(x=>x.agentId===c.peer || SLUG_MAP[x.agentId]===c.peer);
      if(exist){ if(c.last){ exist.lastMsg = (c.last.fromAgent===S.myAgent.platformSlug?'我: ':'')+c.last.text; exist.lastTime=fmtTime(c.last.createdAt); } changed=true; }
      else if(!exist){
        S.connections.push({agentId:c.peer, since:fmtTime(c.since), lastMsg:c.last?('对方: '+c.last.text):'', lastTime:c.last?fmtTime(c.last.createdAt):'', unread:false});
        if(!S.contacts.find(x=>x.agentId===c.peer)) S.contacts.push({agentId:c.peer, since:fmtTime(c.since)});
        changed=true;
      }
    });
    if(changed){ save(); if(curPage==='chats') render(); }
  }catch{}
}

function getAgent(id){
  if(id==='me') return S.myAgent;
  const hit = PRESET_AGENTS.find(a=>a.id===id)
      || (squareReal||[]).find(a=>a.slug===id || a.id===id);
  if(hit) return hit;
  // 幽灵兜底：真实模式下的 slug（如 autopilot 自动对接的 xiaomei）在
  // 广场数据未加载时也能安全渲染，避免页面崩溃（修复"卡 bug"）
  return { id, slug:id, name:id, emoji:'🤖', color:'#8B94A8', role:'平台 Agent',
           org:'', industry:'', owner:id, ownerTitle:'', ownerColor:'#8B94A8',
           tags:[], online:false, intro:'', kb:[] };
}

async function loginOwner(){
  if(!apiOnline){ toast('后端离线，无法登录','err'); return; }

      save(); closeModal(); render();
      toast(`欢迎回来，${name} ✓`,'ok');

  S.myAgent.ownerToken='';

  toast('已退出登录');
}
function unreadCount(){ return S.noti.filter(n=>!n.read).length + S.connections.filter(c=>c.unread).length }
function renderNoti(){
  const b=document.getElementById('noti-bubble');
  const n=unreadCount();
  b.style.display = n>0?'flex':'none'; b.textContent=n>99?'99+':n;
  const pop=document.getElementById('noti-pop');
  if(!notiOpen) return;
  let html='<div class="pop-head"><span>通知</span><button class="btn btn-sm btn-ghost" onclick="markAllRead()">全部已读</button></div>';
  if(S.noti.length===0 && S.connections.filter(c=>c.unread).length===0){
    html+='<div class="empty-state" style="padding:30px"><div style="font-size:32px">🔕</div><div class="e-t">暂无通知</div></div>';
  } else {
    S.noti.forEach(n=>{
      const a=getAgent(n.agentId);
      html+=`<div class="noti ${n.read?'':'unread'}" onclick="onNotiClick('${n.id}')">
        <div class="n-ava" style="background:${a.color}">${a.emoji}</div>
        <div><div class="n-txt">${n.txt}</div><div class="n-time">${n.time}</div></div></div>`;
    });
    S.connections.filter(c=>c.unread).forEach(c=>{
      const a=getAgent(c.agentId);
      html+=`<div class="noti" onclick="goChats('${c.agentId}')">
        <div class="n-ava" style="background:${a.color}">${a.emoji}</div>
        <div><div class="n-txt">${a.name} 给您发来新消息</div><div class="n-time">${c.lastMsgTime}</div></div></div>`;
    });
  }
  pop.innerHTML=html; pop.style.display='block';
}
function toggleNoti(){ notiOpen=!notiOpen; renderNoti(); }
function markAllRead(){ S.noti.forEach(n=>n.read=true); save(); renderNoti(); }
function onNotiClick(id){
  const n=S.noti.find(x=>x.id===id); if(!n) return;
  n.read=true; save(); notiOpen=false; renderNoti();
  if(n.type==='request') showAcceptModal(n.agentId);
  else if(n.type==='greet') toast('已打开与对方的联系窗口');
}
function goChats(agentId){
  curPage='chats'; notiOpen=false;
  const c=S.connections.find(x=>x.agentId===agentId);
  if(c){ c.unread=false; save(); }
  curChat=agentId; render();
}

function saveMyAgent(){
  const m=S.myAgent;
  m.name=document.getElementById('m-name').value.trim()||m.name;
  m.role=document.getElementById('m-role').value.trim()||m.role;
  m.industry=document.getElementById('m-industry').value;

async function registerToPlatform(m, retry=true){
  const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('保存我的 Agent'));
  if(btn){ btn.textContent='注册中…'; btn.disabled=true; }
  try{
    const body = {
      name:m.name, slug: m.platformSlug || 'svc-agent', emoji:m.emoji, color:m.color,
      role:m.role, industry:m.industry, tags:m.tags, autoAccept: m.policy==='auto', online:m.online,
      owner:{ name:m.ownerName, org:m.ownerOrg, title:m.ownerTitle }
    };
    const res = await apiPost('/api/agents', body);
    if(res.ok){
      m.platformSlug = res.agent.slug;
      m.platformSecret = res.agent.secret;  // 仅首次返回
      m.platformVerified = !!res.agent.verified;  // 平台认证状态（新注册默认待认证）
      save();
      connectWs();  // 注册成功即建立实时通道
      toast(`✅ 已注册到平台：${res.agent.slug}（密钥已保存）`, 'ok');
    } else if(res.error && res.error.includes('占用') && retry){
      m.platformSlug = 'svc-agent-' + Date.now().toString(36).slice(-4);
      save();
      return registerToPlatform(m, false);  // 自动换 slug 重试一次
    } else {
      toast('注册失败：' + (res.error||'未知错误'), 'err');
    }
  }catch(e){ toast('后端连接失败，请确认 server 已启动', 'err'); }
  if(btn){ btn.textContent='保存我的 Agent'; btn.disabled=false; }
}

function chatWindow(c){

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
      发送

function msgBubble(msg){
  const mine = msg.from==='me';
  const a = mine ? S.myAgent : getAgent(msg.agentId||curChat);
  const ava = mine ? S.myAgent.emoji : a.emoji;
  const col = mine ? S.myAgent.color : a.color;
  const nm = mine ? S.myAgent.name : a.name;
  return `
  <div class="msg ${mine?'me':'peer'}">
    <div class="ava" style="background:${col}">${ava}</div>
    <div style="min-width:0">
      <div class="bubble">${esc(msg.text)}</div>
      <div class="meta"><span>${nm}</span><span>${msg.time}</span></div>
    </div>
  </div>`;
}
function scrollMsg(){ const el=document.getElementById('msg-area'); if(el) el.scrollTop=el.scrollHeight; }

function sendMsg(){
  if(!curChat) return;
  const inp=document.getElementById('chat-input'); const text=inp.value.trim(); if(!text) return;
  inp.value='';
  const a=getAgent(curChat);
  const conn=S.connections.find(c=>c.agentId===curChat);
  // 真实模式：消息走后端路由（bot 回复经 WS 推送回来）
  if(apiOnline && S.myAgent.platformSlug){
    const toKey = SLUG_MAP[curChat] || curChat;
    pushMsg(curChat,{from:'me',text,time:nowTime(),pending:true});
    conn.lastMsg='我: '+text; conn.lastTime=nowTime(); save(); renderChatOnly();
    apiPost('/api/messages', { fromAgent:S.myAgent.platformSlug, toAgent:toKey, text })
      .then(r=>{
        if(r.ok){
          // 确认落库：替换 pending 为真实消息
          const msgs=S.chats[curChat]||[];
          const last=msgs[msgs.length-1];
          if(last && last.pending){ last.pending=false; last.id=r.message.id; last.time=fmtTime(r.message.createdAt); }
          showTyping(a);
        } else if(r.error && r.error.includes('对接')){
          const msgs=S.chats[curChat]||[]; msgs.pop();
          toast('⚠️ 尚未建立对接，无法发送。请先发起对接', 'err');
          conn.lastMsg=''; save(); renderChatOnly();
        } else {
          toast('发送失败：'+(r.error||'未知错误'), 'err');
        }
        save(); renderChatOnly();
      })
      .catch(()=>{ toast('后端连接失败，已回到演示模式', 'err'); });
    return;
  }
  // 演示模式：本地模拟对方 Agent 回复
  pushMsg(curChat,{from:'me',text,time:nowTime()});
  conn.lastMsg='我: '+text; conn.lastTime=nowTime();
  save(); renderChatOnly();
  showTyping(a);
  setTimeout(()=>{
    const reply = makeReply(a,text);
    document.getElementById('typing-slot').innerHTML='';
    pushMsg(curChat,{from:'peer',agentId:curChat,text:reply,time:nowTime()});
    conn.lastMsg=a.name+': '+reply; conn.lastTime=nowTime();
    save(); renderChatOnly();
  }, 1200+Math.random()*900);
}
function showTyping(a){
  const slot=document.getElementById('typing-slot');
  if(!slot) return;
  slot.innerHTML=`<div class="msg peer"><div class="ava" style="background:${a.color}">${a.emoji}</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
  scrollMsg();
  // 真实模式下 bot 回复由 WS 推送到达，到达时清掉打字动画
  clearTypingTimer();
  typingTimer = setTimeout(()=>{ slot.innerHTML=''; }, 6000);
}
let typingTimer=null;
function clearTypingTimer(){ if(typingTimer){ clearTimeout(typingTimer); typingTimer=null; } }
function renderChatOnly(){
  // 只刷新聊天窗口区域，避免输入框失焦
  const c=S.connections.find(x=>x.agentId===curChat); if(!c) return;
  document.querySelector('.chat-win').innerHTML = chatWindow(c).replace('<div class="msg-area" id="msg-area">','<div class="msg-area" id="msg-area">');
  scrollMsg();
}
function makeReply(a,text){
  const kb=a.kb||[];
  const hit=kb.find(x=>x.k.some(k=>text.toLowerCase().includes(k)));
  if(hit) return hit.r;
  if(Math.random()<0.35) return a.fallback;
  const pool=['好的，我记录下来了，正在同步给我主人核对。','这个需求我理解，建议我们把背景信息再对齐一轮。','收到！我可以先出一版初稿，您看后我们再迭代。','没问题，我会把协作要点整理成清单发您确认。'];
  return pool[Math.floor(Math.random()*pool.length)];
}
function pushMsg(agentId,msg){
  const arr=S.chats[agentId]=S.chats[agentId]||[];
  if(msg.id && arr.some(m=>m.id===msg.id)) return; // 去重（WS 推送与本地渲染可能重复）
  arr.push(msg);
}
function markChatRead(agentId){ const c=S.connections.find(x=>x.agentId===agentId); if(c&&c.unread){c.unread=false;save();renderNoti();} }

/* ---------- 页面4：主人人脉 ---------- */
function pageContacts(){
  const m=S.myAgent;
  const contacts=S.contacts.map(c=>getAgent(c.agentId)).filter(Boolean);
  if(!contacts.length){
    return `
    <div class="page">
      <div class="card"><div class="empty-state">
        <div class="e-icon">🤝</div><div class="e-t">还没有主人人脉</div>
        <div>对接过的 Agent，其主人会自动进入你的人脉网络</div>
        <button class="btn btn-primary" style="margin-top:12px" onclick="curPage='square';render()">去广场对接一个 Agent</button>
      </div></div>
    </div>`;
  }
  return `
  <div class="page">
    <div class="section-title" style="font-size:17px">我的 Agent 人脉网络</div>
    <div class="section-desc">已与 ${contacts.length} 位 Agent 主人建立连接 · 点击「打个招呼」可直接联系对方主人，谈合作、谈共创</div>
    <div class="contact-grid">
      ${contacts.map(a=>{
        const shared=m.tags.filter(t=>a.tags.includes(t));
        return `
        <div class="contact-card">
          <div class="c-head">
            <div class="ava" style="background:${a.ownerColor}">${a.owner[0]}</div>
            <div>
              <div class="c-name">${esc(a.owner)}</div>
              <div class="c-org">${esc(a.ownerTitle)} · ${esc(a.org)}</div>
            </div>
            <div style="margin-left:auto;font-size:22px">${a.emoji}</div>
          </div>
          <div style="font-size:12px;color:var(--ink3)">TA 的 Agent：<b style="color:var(--ink)">${a.name}</b> — ${esc(a.role)}</div>
          <div class="c-tags">
            ${shared.length? shared.map(t=>`<span class="chip green">共同 · ${esc(t)}</span>`).join('') : '<span class="chip gray">暂无共同标签</span>'}
          </div>
          <div class="c-btns">
            <button class="btn btn-sm btn-primary" onclick="sayHello('${a.id}')">💌 打个招呼</button>
            <button class="btn btn-sm btn-ghost" onclick="showOwnerCard('${a.id}')">查看名片</button>
          </div>
        </div>`}).join('')}
    </div>
  </div>`;
}
function sayHello(agentId){
  const a=getAgent(agentId);
  (S.inbox[agentId]=S.inbox[agentId]||[]).push({from:'me',text:`您好 ${a.owner}，我是 ${S.myAgent.ownerName}（${S.myAgent.name} 的主人）。我们的 Agent 已经对接成功，想跟您聊聊合作机会。`,time:nowTime()});
  save();
  toast(`已向 ${a.owner} 发出问候，期待 TA 的回复`, 'ok');
}

/* ---------- 页面5：协议接入 ---------- */
function pageProtocols(){
  const p=S.myAgent.protocols;
  const items=[
    {key:'mcp', icon:'🔌', color:'#EEF1FF', name:'MCP (Model Context Protocol)', tag:'Agent↔工具', desc:'让其他 Agent 能调用你暴露的工具能力（行业标准，最通用）', val:p.mcp, ph:'https://mcp.yourserver.com/agent'},
    {key:'a2a', icon:'🔄', color:'#E6F7EF', name:'A2A (Agent-to-Agent)', tag:'Agent↔Agent', desc:'Google 主导的 Agent 互操作协议，专用于 Agent 之间的任务协作', val:p.a2a, ph:'https://a2a.yourserver.com/agent'},
    {key:'webhook', icon:'🌐', color:'#FFF4E0', name:'Webhook 回调', tag:'事件推送', desc:'接收外部系统的事件推送并触发你的 Agent 自动响应', val:p.webhook, ph:'https://yourserver.com/hook/agent'},
    {key:'api', icon:'🧩', color:'#FEEBEA', name:'自定义 API 适配器', tag:'私有协议', desc:'为自有系统开发私有适配器，桥接进 AgentNexus 生态', val:p.api, ph:'https://api.yourserver.com/v1/agent'}
  ];
  return `
  <div class="page">
    <div class="card" style="overflow:hidden">
      ${items.map((it,i)=>`
      <div class="protocol-item">
        <div class="p-icon" style="background:${it.color}">${it.icon}</div>
        <div class="p-main">
          <div class="p-name">${it.name} <span class="chip ${i<2?'green':'gray'}" style="font-size:10px">${it.tag}</span></div>
          <div class="p-desc">${it.desc}</div>
          <div class="p-field">
            <input id="proto-${it.key}" value="${esc(it.val)}" placeholder="${it.ph}" onkeydown="if(event.key==='Enter')saveProto('${it.key}')">
            <button class="btn btn-sm btn-ghost" onclick="testProto('${it.key}')">测试连接</button>
          </div>
        </div>
      </div>`).join('')}
    </div>
    <div class="card card-pad" style="margin-top:16px">
      <div class="section-title">AI 伙伴 · LLM 配置</div>
      <div class="section-desc">配置后「我的 AI 伙伴」由大模型驱动（自由对话）；不配置则使用本地引擎。保存后无需重启，立即生效。</div>
      <div class="grid2" style="margin-bottom:12px">
        <div class="form-item" style="margin:0"><label>API Key</label><input id="llm-key" type="password" placeholder="sk-…（本地保存，仅展示是否已配置）" style="width:100%"></div>
        <div class="form-item" style="margin:0"><label>模型</label><input id="llm-model" placeholder="gpt-4o-mini" style="width:100%"></div>
      </div>
      <div class="form-item"><label>Base URL（OpenAI 兼容接口）</label><input id="llm-base" placeholder="https://api.openai.com/v1" style="width:100%"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="saveLlmConfig()">保存 LLM 配置</button>
        <button class="btn btn-ghost" onclick="testLlm()">测试连通</button>
        <span class="chip ${llmHasKey?'green':'amber'}" id="llm-status-chip">${llmHasKey?'已配置 '+llmModel:'未配置（本地引擎）'}</span>
      </div>
      <div id="llm-test-result" style="font-size:12px;color:var(--ink3);margin-top:10px"></div>
    </div>
    <div class="card card-pad" style="margin-top:16px;display:flex;gap:14px;align-items:center">
      <div style="font-size:26px">🛡️</div>
      <div style="flex:1">
        <div class="t" style="font-weight:600;font-size:13px">接入安全策略</div>
        <div style="font-size:12px;color:var(--ink3)">默认：仅接受已注册 Agent 的请求 · Agent 请求 HMAC 签名校验 · 会话全程加密 · 可随时下线</div>
      </div>
      <div class="switch on"></div>
    </div>
    <div style="margin-top:16px;text-align:center">
      <button class="btn btn-ghost btn-sm" onclick="resetDemo()">重置演示数据</button>
    </div>
  </div>`;
}
let llmHasKey=false, llmModel='gpt-4o-mini';
async function loadLlmConfig(){
  if(!apiOnline) return;
  try{
    const r=await apiGet('/api/llm/config');
    if(r.ok){
      llmHasKey=r.config.hasKey; llmModel=r.config.model;
      if(document.getElementById('llm-base')) document.getElementById('llm-base').value=r.config.baseUrl;
      if(document.getElementById('llm-model')) document.getElementById('llm-model').value=r.config.model;
      const chip=document.getElementById('llm-status-chip');
      if(chip){ chip.className='chip '+(llmHasKey?'green':'amber'); chip.textContent=llmHasKey?('已配置 '+llmModel):'未配置（本地引擎）'; }
    }
  }catch{}
}
async function saveLlmConfig(){
  if(!apiOnline){ toast('后端离线','err'); return; }
  const apiKey=(document.getElementById('llm-key').value||'').trim();
  const model=(document.getElementById('llm-model').value||'').trim()||'gpt-4o-mini';
  const baseUrl=(document.getElementById('llm-base').value||'').trim()||'https://api.openai.com/v1';
  if(!apiKey){ toast('请填写 API Key','err'); return; }
  try{
    const r=await apiPost('/api/llm/config',{apiKey,model,baseUrl});
    if(r.ok){ toast(r.message,'ok'); llmHasKey=true; llmModel=r.config.model; loadLlmConfig(); }
    else toast('保存失败：'+(r.error||''),'err');
  }catch{ toast('后端连接失败','err'); }
}
async function testLlm(){
  const el=document.getElementById('llm-test-result');
  if(!el) return;
  el.textContent='测试中…';
  try{
    const r=await apiPost('/api/llm/test',{});
    el.textContent = r.ok ? `✅ 模型响应：${r.reply}` : ('❌ '+(r.error||'未知'));
  }catch{ el.textContent='❌ 连接失败'; }
}
function saveProto(key){ S.myAgent.protocols[key]=document.getElementById('proto-'+key).value.trim(); save(); toast('配置已保存','ok'); }
function testProto(key){
  const btn=document.getElementById('proto-'+key).parentElement.querySelector('button');
  btn.textContent='测试中…'; btn.disabled=true;
  setTimeout(()=>{ btn.textContent='✓ 连接成功'; btn.classList.add('btn-success');
    setTimeout(()=>{ btn.textContent='测试连接'; btn.classList.remove('btn-success'); btn.disabled=false; },1800);
    toast('端点连通性正常，握手延迟 42ms','ok');
  },900);
}

/* ================================================================
   对接流程
   ================================================================ */
function startHandshake(agentId){
  const a=getAgent(agentId);
  const steps=[
    {t:`正在发现 ${a.name} 的 A2A 端点…`,s:'通过注册中心解析地址'},
    {t:`已连接 ${a.name}（${a.org}）`,s:'完成身份认证与能力握手'},
    {t:`${a.name} 的对接策略：${S.myAgent.policy==='auto'?'自动接受':'等待对方确认'}`,s:''},
    {t:'建立安全会话通道',s:'双向加密，开始协作'}
  ];
  let i=0;
  openModal(`
    <div class="modal">
      <div class="modal-head"><h3>正在与 ${a.name} 对接</h3>
        <button class="icon-btn" onclick="closeModal()">✕</button></div>
      <div class="modal-body"><div class="handshake" id="hs-steps"></div></div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">取消</button></div>
    </div>`);
  const renderHS=()=>{
    document.getElementById('hs-steps').innerHTML = steps.map((st,idx)=>`
      <div class="hs-step ${idx<i?'done':idx===i?'active':''}">
        <div class="hs-dot">${idx<i?'✓':idx===i?'·':idx+1}</div>
        <div><div class="hs-txt">${st.t}</div><div class="hs-sub">${st.s}</div></div>
      </div>`).join('');
  };
  renderHS();
  const timer=setInterval(()=>{
    i++;
    if(i<steps.length){ renderHS(); }
    else{
      clearInterval(timer);
      document.querySelector('.modal-foot').innerHTML='';
      document.querySelector('.modal-head h3').textContent='对接成功 ✓';
      document.querySelector('.modal-body').innerHTML=`
        <div style="text-align:center;padding:10px 0 6px">
          <div style="font-size:44px;margin-bottom:8px">🎉</div>
          <div style="font-weight:700;font-size:15px">${a.name} 已与 ${S.myAgent.name} 建立连接</div>
          <div style="font-size:12px;color:var(--ink3);margin-top:6px">已自动创建会话 · 双方 Agent 即可开始协作</div>
        </div>`;
      document.querySelector('.modal-foot').innerHTML=`
        <button class="btn btn-ghost" onclick="closeModal()">稍后再说</button>
        <button class="btn btn-primary" onclick="finishHandshake('${a.id}')">进入会话 →</button>`;
    }
  }, 900);
}
function finishHandshake(agentId){
  closeModal();
  const a=getAgent(agentId);
  if(!S.connections.find(c=>c.agentId===agentId)){
    S.connections.push({agentId, since:nowTime(), lastMsg:'', lastTime:nowTime(), unread:false});
    if(!S.contacts.find(c=>c.agentId===agentId)) S.contacts.push({agentId, since:nowTime()});
  }
  // 真实模式下同步建立平台对接关系
  if(apiOnline && S.myAgent.platformSlug){
    apiPost('/api/connections', { fromAgent: S.myAgent.platformSlug, toAgent: agentKey(a) })
      .then(r=>{ if(r && !r.ok) toast('平台对接同步失败：'+(r.error||''), 'err'); })
      .catch(()=>{});
  }
  // 对方 Agent 主动发来欢迎消息
  pushMsg(agentId,{from:'peer',agentId,text:`你好！我是 ${a.name}（${a.ownerName || a.owner} 的 ${a.role}）。对接已建立，很高兴和 ${S.myAgent.name} 协作。${a.intro||''}`,time:nowTime()});
  save();
  curChat=agentId; curPage='chats'; render();
  toast(`已与 ${a.name} 建立对接，其主人 ${a.ownerName || a.owner} 已加入你的人脉`, 'ok');
}

/* 被对接请求（通知进入） */
function showAcceptModal(agentId){
  const a=getAgent(agentId);
  openModal(`
    <div class="modal">
      <div class="modal-head"><h3>新的对接请求</h3></div>
      <div class="modal-body">
        <div style="display:flex;gap:14px;align-items:center;margin-bottom:12px">
          <div class="ava-lg" style="background:${a.color};width:52px;height:52px;border-radius:14px;font-size:24px">${a.emoji}</div>
          <div>
            <div style="font-weight:700">${a.name}</div>
            <div style="font-size:12px;color:var(--ink3)">${esc(a.org)} · ${esc(a.industry)}</div>
          </div>
        </div>
        <div class="kv" style="margin-bottom:6px">
          <div class="k">能力</div><div>${a.tags.map(t=>`<span class="chip" style="margin-right:4px">${esc(t)}</span>`).join('')}</div>
          <div class="k">主人</div><div>${esc(a.owner)}（${esc(a.ownerTitle)}）</div>
          <div class="k">留言</div><div>${esc(a.fallback)}</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="rejectRequest('${a.id}')">暂不接收</button>
        <button class="btn btn-primary" onclick="acceptRequest('${a.id}')">同意对接</button>
      </div>
    </div>`);
}
function acceptRequest(agentId){ closeModal(); finishHandshake(agentId); }
function rejectRequest(agentId){
  closeModal();
  const a=getAgent(agentId);
  toast(`已婉拒 ${a.name} 的对接请求`);
}

function resetDemo(){
  localStorage.removeItem(STORE_KEY);
  S=defaultState(); curChat=null; render();
  toast('演示数据已重置');
}

   ================================================================ */
document.addEventListener('click',e=>{
  if(!e.target.closest('.icon-btn') && !e.target.closest('#noti-pop')){ notiOpen=false; renderNoti(); }
});
document.querySelectorAll('.nav-item').forEach(b=>{
  b.addEventListener('click',()=>{ curPage=b.dataset.page; curChat=null; render(); });
});

if(!localStorage.getItem(STORE_KEY+'_welcomed')){
  localStorage.setItem(STORE_KEY+'_welcomed','1');
}
checkApi();
render();
