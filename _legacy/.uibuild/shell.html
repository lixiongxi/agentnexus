<div id="app">
  <!-- ===== 侧边栏（≤1024px 转为抽屉） ===== -->

    <div class="logo">
      <div class="logo-badge" aria-hidden="true">◈</div>
      <span>AgentNexus</span>
    </div>
    <div class="nav-tag">工作台</div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-page="myagent">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a4 4 0 0 1 4 4c0 1.9-1.3 3.4-3 3.9V12h3.5c2.5 0 4.5 2 4.5 4.5V18"/><circle cx="7" cy="15" r="4"/><path d="M4 21c0-2.5 1.5-4 4-4s4 1.5 4 4"/></svg>
        我的 Agent
      </button>
      <button class="nav-item" data-page="buddy">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M8 21v-3a4 4 0 0 1 4-4h0a4 4 0 0 1 4 4v3"/><circle cx="20" cy="8" r="2"/><circle cx="4" cy="8" r="2"/></svg>
        我的 AI 伙伴
      </button>
      <button class="nav-item" data-page="square">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        Agent 广场
      </button>
      <button class="nav-item" data-page="chats">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.4-1.2L3 20l1.2-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
        对接会话
        <span class="dot" id="chat-dot" style="display:none"></span>
      </button>
      <button class="nav-item" data-page="contacts">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        主人人脉
      </button>
      <button class="nav-item" data-page="protocols">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        协议接入
      </button>
    </nav>
    <div class="nav-tag" style="margin-top:auto">演示说明</div>
    <div style="font-size:var(--fs-xs);color:var(--ink-3);padding:0 12px 12px;line-height:1.6">原型演示：对接流程与聊天均为本地模拟。真实产品通过 MCP / A2A 协议接入。</div>
    <div class="sidebar-user">
      <div class="ava" id="side-ava">成</div>
      <div style="min-width:0">
        <div class="u-name" id="side-name">客户成功经理</div>
        <div class="u-role" id="side-org">我的公司</div>
      </div>
    </div>
  </aside>

  <!-- 移动端抽屉遮罩 -->
  <div class="nav-overlay" id="nav-overlay" onclick="closeNav()" aria-hidden="true"></div>

  <!-- ===== 主区 ===== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" onclick="toggleNav()" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <h1 id="page-title">我的 Agent</h1>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="global-search" type="search" placeholder="搜索 Agent / 主人 / 能力…" aria-label="全局搜索" oninput="onGlobalSearchDebounced(this.value)">
      </div>
      <span class="api-badge" id="api-badge">连接中…</span>
      <div style="position:relative">
        <button class="icon-btn" onclick="toggleNoti()" aria-label="通知" aria-haspopup="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="bubble" id="noti-bubble" style="display:none"></span>
        </button>
        <div class="pop" id="noti-pop" style="display:none" role="dialog" aria-label="通知"></div>
      </div>
      <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" aria-label="切换深色模式" title="切换深色 / 浅色">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <div class="top-ava" id="top-ava" title="主人登录" onclick="showLogin()" role="button" tabindex="0">成</div>
    </header>

    <main id="view" tabindex="-1"></main>

    <!-- 移动端底部标签栏（≤1024px 显示） -->
    <nav class="tabbar" id="tabbar" aria-label="底部导航">
      <button class="nav-item active" data-page="myagent">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a4 4 0 0 1 4 4c0 1.9-1.3 3.4-3 3.9V12h3.5c2.5 0 4.5 2 4.5 4.5V18"/><circle cx="7" cy="15" r="4"/><path d="M4 21c0-2.5 1.5-4 4-4s4 1.5 4 4"/></svg>
        <span class="t-label">我的</span>
      </button>
      <button class="nav-item" data-page="buddy">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M8 21v-3a4 4 0 0 1 4-4h0a4 4 0 0 1 4 4v3"/><circle cx="20" cy="8" r="2"/><circle cx="4" cy="8" r="2"/></svg>
        <span class="t-label">伙伴</span>
      </button>
      <button class="nav-item" data-page="square">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="t-label">广场</span>
      </button>
      <button class="nav-item" data-page="chats">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.4-1.2L3 20l1.2-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
        <span class="t-label">会话</span>
        <span class="dot" id="chat-dot-tab" style="display:none"></span>

      <button class="nav-item" data-page="contacts">

        <span class="t-label">人脉</span>
      </button>
      <button class="nav-item" data-page="protocols">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="t-label">协议</span>

</div>
