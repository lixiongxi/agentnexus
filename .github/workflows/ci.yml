name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server · typecheck & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # CI 专用配置：仓库不提交 .env，此处提供最小可运行环境
      DATABASE_URL: "file:./ci.db"
      AUTH_MODE: strict
      SESSION_SECRET: ci-only-session-secret-not-for-production
      ADMIN_TOKEN: ci-only-admin-token-not-for-production
      CORS_ORIGIN: "*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate & database push (SQLite)
        run: npx prisma db push --skip-generate && npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (21 cases)
        run: npm test

  web:
    name: Web · typecheck & production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build (vite + tsc)
        run: npm run build
